<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D practice game for the German practical driving test (class B)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Fahrprüfung 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#00588c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Roboto+Condensed:wght@500;600;700&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage, examiner strip and rear-view mirror on top, side mirrors left/right, instrument cluster bottom-centre, wheel left, pedals right. */
:root{
  --bg:#d9dde1; --panel:#eceff2; --card:#ffffff; --ink:#16191d; --muted:#59616a; --line:#c3c9cf;
  --key:#ffffff; --key-ink:#16191d; --glass:rgba(18,21,25,.8); --on-glass:#ffffff; --sky:#b9d3e6;
  --yellow:#f7b500; --on-yellow:#16191d; --red:#c1121c; --blue:#00588c; --green:#008754; --on-accent:#ffffff;
  --de:'Barlow Semi Condensed','DIN Alternate','Arial Narrow',Arial,sans-serif;
  --fa:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;             /* running text */
  --lbl:'Barlow Semi Condensed','Roboto Condensed','Arial Narrow',Arial,sans-serif;   /* labels; Roboto Condensed covers Cyrillic */
}
:root:lang(fa),:root:lang(ar){--ui:var(--fa);--lbl:var(--fa)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1114; --panel:#181b1f; --card:#20242a; --ink:#eef0f2; --muted:#9aa2ab; --line:#333941;
    --key:#262b32; --key-ink:#eef0f2; --blue:#2a86bd; --red:#e2424b; --green:#22a777; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1114; --panel:#181b1f; --card:#20242a; --ink:#eef0f2; --muted:#9aa2ab; --line:#333941;
  --key:#262b32; --key-ink:#eef0f2; --blue:#2a86bd; --red:#e2424b; --green:#22a777; color-scheme:dark;
}
*{box-sizing:border-box}
html{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-text-size-adjust:100%}
kbd{font:600 12px/1 var(--de);border:1px solid var(--line);border-radius:4px;padding:1px 5px;direction:ltr;unicode-bidi:isolate}

#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--panel)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--sky)}
canvas{display:block;width:100%;height:100%}

#top{position:absolute;top:10px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;direction:ltr}
#examiner{width:100%;max-width:620px;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px 9px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#examiner .who{flex:none;font:600 12px/1 var(--lbl);background:var(--blue);color:var(--on-accent);padding:6px 8px;border-radius:7px;margin-top:1px}
#examiner .say{flex:1;min-width:0}
#ex-de{font:600 17.5px/1.2 var(--de);color:var(--ink)}
#ex-tr{text-align:start;font-size:12px;line-height:1.5;color:var(--muted);margin-top:2px}
#examiner.new{animation:nudge .9s ease-out}
@keyframes nudge{0%{background:var(--yellow)}100%{background:var(--card)}}
#chips{width:100%;max-width:620px;display:flex;justify-content:space-between;gap:8px}
.chip{appearance:none;-webkit-appearance:none;border:0;background:var(--glass);color:var(--on-glass);border-radius:10px;padding:7px 11px;font:500 13px/1.4 var(--ui);pointer-events:auto}
button.chip{font:600 14px/1.3 var(--lbl);cursor:pointer;touch-action:manipulation}
button.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#score{font:600 14px/1.3 var(--lbl);font-variant-numeric:tabular-nums}
#mult{color:var(--yellow);margin-left:4px}
#count .sev{color:#ff9aa0}
#toast{width:100%;max-width:620px;background:var(--yellow);color:var(--on-yellow);border-radius:12px;padding:8px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
#toast.good{background:var(--green);color:var(--on-accent)}
#toast b{display:block;font:700 15px/1.25 var(--lbl)}
#toast span{font-size:12.5px;line-height:1.55}

#speedo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);direction:ltr;display:flex;align-items:center;gap:6px;background:var(--glass);color:var(--on-glass);border-radius:18px;padding:6px 10px}
#dial{display:block;width:92px;height:92px;fill:none;stroke:currentColor}
#dial .tick{stroke-width:1.4;opacity:.75} #dial .tick.major{stroke-width:2.4;opacity:1}
#dial text{fill:currentColor;stroke:none;text-anchor:middle;font-family:var(--de)}
#dial .lbl{font-size:10px;font-weight:600;opacity:.8}
#kmh{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
#dial .unit{font-size:8px;opacity:.7}
#needle{stroke:var(--red);stroke-width:2.6;stroke-linecap:round}
#hub{fill:currentColor;stroke:none}
#speedo .ind{width:22px;height:22px;fill:currentColor;opacity:.22}
#speedo .ind.on{fill:var(--yellow);opacity:1}

/* Mirrors are empty frames over the canvas; the render loop paints a mirrored camera view into each frame's inner box. */
.mirror{display:block;padding:0;margin:0;border:5px solid #1d2024;border-radius:12px;background:transparent;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:border-color .15s}
.mirror.on{border-color:var(--blue)}
#mirC{width:min(46%,250px);aspect-ratio:3.4;border-radius:10px}
.mirror.side{appearance:none;-webkit-appearance:none;position:absolute;bottom:122px;width:clamp(96px,30%,210px);aspect-ratio:1.55;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#mirL{left:10px} #mirR{right:10px}
.mirror.side:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

#controls{direction:ltr;display:grid;gap:8px;padding:10px 16px 12px;background:var(--panel);
  grid-template-columns:repeat(4,1fr);grid-template-areas:"lookL blL blR lookR" "steer steer brake gas"}
#lookL{grid-area:lookL} #blL{grid-area:blL} #blR{grid-area:blR} #lookR{grid-area:lookR}
#steer{grid-area:steer} #brake{grid-area:brake} #gas{grid-area:gas}
.key{appearance:none;-webkit-appearance:none;min-width:0;border:1px solid var(--line);background:var(--key);color:var(--key-ink);border-radius:12px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 13.5px/1.1 var(--lbl);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.key svg{width:20px;height:20px;fill:currentColor;flex:none}
.key small{font:500 10.5px/1.3 var(--lbl);color:var(--muted)}
.key:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.key.blink.on{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.key.blink.on.dim{background:color-mix(in srgb,var(--yellow) 45%,var(--key))}
.key.on small,#gas small{color:inherit;opacity:.8}
.key.look.on{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
#brake,#gas,#steer{height:72px}
#brake,#gas{font-size:18px;font-weight:700}
#brake{border:2px solid var(--red);color:var(--red)}
#brake.on{background:var(--red);color:var(--on-accent)}
#gas{background:var(--ink);border-color:var(--ink);color:var(--panel)}
#gas.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
#steer{position:relative;border:1px solid var(--line);background:var(--key);border-radius:36px;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;cursor:ew-resize}
#steer::before{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;background:var(--line)}
#knob{position:relative;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;pointer-events:none}
#knob svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2}

@media (orientation:landscape){
  #controls{position:absolute;left:0;right:0;bottom:0;background:none;pointer-events:none;z-index:2;
    grid-template-columns:84px 84px 1fr 84px 84px;grid-template-areas:"lookL blL . blR lookR" "steer steer . brake gas"}
  #controls>*{pointer-events:auto}
  .key,#steer{background:color-mix(in srgb,var(--key) 82%,transparent)}
  #gas{background:color-mix(in srgb,var(--ink) 86%,transparent)}
  .key{min-height:46px}
  #brake,#gas,#steer{height:64px}
  .mirror.side{bottom:150px;width:clamp(96px,17vw,200px)}
  #dial{width:74px;height:74px}
}
@media (orientation:landscape) and (max-height:460px){
  #ex-tr{display:none} #ex-de{font-size:16px}
  .key small{display:none}
  .mirror.side{width:110px} #mirC{width:min(30%,200px)}
}

.ov{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.ov.show{display:flex}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px 6px 18px 18px;border-top:6px solid var(--blue);padding:18px 20px 20px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet.bad{border-top-color:var(--red)} .sheet.good{border-top-color:var(--green)}
.form-head{font:600 14px/1.3 var(--lbl);color:var(--muted);padding-bottom:8px;border-bottom:1px dashed var(--line);margin-bottom:14px}
h1{font-size:24px;line-height:1.35;margin:0 0 8px;font-weight:700;text-wrap:balance}
h2{font:700 21px/1.25 var(--lbl);margin:0 0 6px}
p{margin:0 0 12px;font-size:14.5px;line-height:1.85}
ol.rules{list-style:decimal;margin:0 0 14px;padding:0;padding-inline-start:20px;font-size:14px;line-height:1.85}
:root:lang(fa) ol.rules{list-style:persian} :root:lang(ar) ol.rules{list-style:arabic-indic}
ol.rules li{margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.75}
.keys-hint,.touch-hint{display:none}
@media (pointer:coarse){.touch-hint{display:block}}
@media (hover:hover) and (pointer:fine){.keys-hint{display:block}}
label.opt{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0 16px;cursor:pointer}
label.opt input{width:18px;height:18px;accent-color:var(--blue)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;-webkit-appearance:none;flex:1;min-width:130px;height:50px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:var(--card);font:700 15.5px var(--ui);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stamp{display:inline-block;font:700 26px/1 var(--lbl);letter-spacing:.04em;padding:9px 14px 10px;border:3px solid currentColor;border-radius:8px;transform:rotate(-3deg);margin:6px 0 14px}
.good .stamp{color:var(--green)} .bad .stamp{color:var(--red)}
.verdict{font-size:15px;font-weight:700;margin-bottom:6px}
.scoreline{font-size:14px;line-height:1.7;margin-bottom:12px}
.scoreline .stars{font-size:22px;letter-spacing:2px;color:var(--yellow);direction:ltr;unicode-bidi:isolate;margin-inline-end:8px}
ul.log{list-style:none;margin:0 0 14px;padding:0;border-top:1px dashed var(--line)}
ul.log li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.7}
ul.log b{display:block;font:600 15.5px/1.3 var(--lbl)}
ul.log li.sev b{color:var(--red)}
ul.log li.sev b::before{content:"✕ "}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.langs button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px/1.2 var(--lbl);cursor:pointer}
.langs button:lang(fa),.langs button:lang(ar){font-family:var(--fa)}
.langs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.langs button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#examiner.new{animation:none}#toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="cv" data-ta="cv"></canvas>
    <div id="top">
      <div id="examiner" aria-live="polite"><span class="who" data-t="examiner"></span><div class="say"><div id="ex-de" lang="de"></div><div id="ex-tr"></div></div></div>
      <div id="chips">
        <button class="chip" id="camBtn" type="button"></button>
        <div class="chip" id="score"><span data-t="points"></span> <b id="pts">0</b><span id="mult"></span></div>
        <div class="chip" id="count"><span data-t="minor"></span> <b id="minor">0</b><span id="sevwrap" hidden> | <span class="sev"><span data-t="severe"></span> <b id="severe">0</b></span></span></div>
      </div>
      <div class="mirror" id="mirC" role="img" data-ta="mirC"></div>
      <div id="toast" role="status"><b></b><span></span></div>
    </div>
    <button class="mirror side" id="mirL" type="button" data-ta="mirL"></button>
    <button class="mirror side" id="mirR" type="button" data-ta="mirR"></button>
    <div id="speedo">
      <svg class="ind" id="indL" viewBox="0 0 24 24"><path d="M11 4 2 12l9 8v-5h10V9H11z"/></svg>
      <svg id="dial" viewBox="0 0 100 100" role="img" data-ta="dial">
        <g id="ticks"></g>
        <line id="needle" x1="44" y1="50" x2="88" y2="50"/><circle id="hub" cx="50" cy="50" r="4.5"/>
        <text id="kmh" x="50" y="80">0</text><text class="unit" x="50" y="92">km/h</text>
      </svg>
      <svg class="ind" id="indR" viewBox="0 0 24 24"><path d="m13 4 9 8-9 8v-5H3V9h10z"/></svg>
    </div>
  </div>

  <div id="controls">
    <button class="key look" id="lookL" type="button" data-ta="look left"><svg viewBox="0 0 24 24"><circle cx="13" cy="8" r="4.5"/><path d="M10 12.5 2 23l9.5-3z" opacity=".55"/></svg><span data-t="look"></span><small data-t="left"></small></button>
    <button class="key blink" id="blL" type="button" data-ta="blink left"><svg viewBox="0 0 24 24"><path d="M11 4 2 12l9 8v-5h10V9H11z"/></svg><span data-t="blink"></span><small data-t="left"></small></button>
    <button class="key blink" id="blR" type="button" data-ta="blink right"><svg viewBox="0 0 24 24"><path d="m13 4 9 8-9 8v-5H3V9h10z"/></svg><span data-t="blink"></span><small data-t="right"></small></button>
    <button class="key look" id="lookR" type="button" data-ta="look right"><svg viewBox="0 0 24 24"><circle cx="11" cy="8" r="4.5"/><path d="M14 12.5 22 23l-9.5-3z" opacity=".55"/></svg><span data-t="look"></span><small data-t="right"></small></button>
    <div id="steer" role="slider" data-ta="steer" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" tabindex="-1">
      <div id="knob"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="13"/><path d="M4 17h9m8 0h9M17 21v9"/><circle cx="17" cy="17" r="4"/></svg></div>
    </div>
    <button class="key" id="brake" type="button"><span data-t="brake"></span></button>
    <button class="key" id="gas" type="button"><span data-t="gas"></span></button>
  </div>

  <div class="ov show" id="intro">
    <div class="sheet">
      <div class="langs" id="langs" role="group" data-ta="lang"></div>
      <div class="form-head" data-t="formIntro"></div>
      <h1 data-t="title"></h1>
      <p id="introText"></p>
      <ol class="rules" id="rules"></ol>
      <p class="hint touch-hint" data-t="touchHint"></p>
      <p class="hint keys-hint" data-th="keysHint"></p>
      <label class="opt" style="margin-bottom:4px"><input type="checkbox" id="sound" checked> <span data-t="sound"></span></label>
      <label class="opt"><input type="checkbox" id="voice"> <span data-t="voice"></span></label>
      <div class="btns"><button class="btn" id="startBtn" type="button" data-t="start"></button><button class="btn ghost" id="installBtn" type="button" data-t="install" hidden></button></div>
    </div>
  </div>

  <div class="ov" id="fail">
    <div class="sheet bad">
      <div class="form-head" data-t="failHead"></div>
      <h2 id="fail-title"></h2>
      <p id="fail-text"></p>
      <p class="hint" data-t="failHint"></p>
      <div class="btns"><button class="btn" id="contBtn" type="button" data-t="cont"></button><button class="btn ghost" id="againBtn1" type="button" data-t="again"></button></div>
    </div>
  </div>

  <div class="ov" id="result">
    <div class="sheet" id="resSheet">
      <div class="form-head" data-t="resHead"></div>
      <div><span class="stamp" id="stamp"></span></div>
      <div class="verdict" id="verdict"></div>
      <div class="scoreline"><span class="stars" id="stars"></span><span id="scoreline"></span></div>
      <ul class="log" id="log"></ul>
      <p class="hint" data-t="resHint"></p>
      <div class="btns"><button class="btn" id="againBtn2" type="button" data-t="again"></button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {

const TX = {
de:{ name:'Deutsch', dir:'ltr',

function updActor(a,dt){

  }

  for(const a of S.actors) updActor(a,dt);
  if(S.mode==='run' && S.v>0.3 && S.T>S.ghostUntil) for(const a of S.actors) if(hits(a)){ err('crash'); break; }
  if(S.actors.some(a=>a.dead)){ for(const a of S.actors) if(a.dead) scene.remove(a.mesh); S.actors=S.actors.filter(a=>!a.dead); }
}

/* ---------- render ---------- */
function sync(){
  const S=st, ph=(S.T*2.6%1)<0.5;
  player.position.set(S.x,0,S.y); player.rotation.y=-S.phi;
  for(const o of player.userData.tails) o.material=keys.brake?carM.tailOn:carM.tail;
  for(const o of player.userData.blL) o.visible=S.blink===-1&&ph;
  for(const o of player.userData.blR) o.visible=S.blink===1&&ph;
  for(const a of S.actors){ const q=pathAt(a.path,a.s); a.mesh.position.set(q.x, a.kind==='ped'&&a.v?Math.abs(Math.sin(S.T*9))*0.05:0, q.y); a.mesh.rotation.y=-Math.atan2(q.hy,q.hx); }
  const L=S.light, on=[L==='red'||L==='redyellow'?lampMat.red:lampMat.off, L==='yellow'||L==='redyellow'?lampMat.yellow:lampMat.off, L==='green'||L==='go'?lampMat.green:lampMat.off];
  for(const set of lamps) set.forEach((l,i)=>{ l.material=on[i]; });
}
function camera3(dt){
  const S=st, chase=camMode==='chase';
  let d=S.phi-camYaw; d=Math.atan2(Math.sin(d),Math.cos(d)); camYaw+=d*(1-Math.exp(-dt*6));
  lookO+=(S.look*(chase?2.3:1.95)-lookO)*(1-Math.exp(-dt*11));
  if(chase){
    const k=Math.min(1,Math.abs(lookO)/2.3), a=camYaw+Math.PI+lookO, dist=7.4-2*k, ahead=5.5*(1-k);
    cam.position.set(S.x+Math.cos(a)*dist, 2.9-0.5*k, S.y+Math.sin(a)*dist);
    cam.lookAt(S.x+Math.cos(camYaw)*ahead, 1.15, S.y+Math.sin(camYaw)*ahead);
  } else {
    const c=Math.cos(S.phi), n=Math.sin(S.phi), ex=S.x+c*0.1+n*0.36, ey=S.y+n*0.1-c*0.36, a=S.phi+lookO;
    cam.position.set(ex,1.24,ey); cam.lookAt(ex+Math.cos(a)*10,1.12,ey+Math.sin(a)*10);
  }
  cockpit.visible=!chase; wheel.rotation.x=S.steer*2.2;
  const base=chase?60+8*Math.min(1,S.v/18):72, asp=W/H;
  const fov=clamp(Math.max(base, 2*Math.atan(Math.tan(34*Math.PI/180)/asp)*180/Math.PI),40,92);
  if(Math.abs(fov-cam.fov)>0.05){ cam.fov=fov; cam.updateProjectionMatrix(); }
}
let mirTick=0, avgDt=1/60;
function mirrors(dt){
  const cr=cv.getBoundingClientRect(), pr=renderer.getPixelRatio();
  avgDt+=(dt-avgDt)*0.05; const fresh=avgDt<0.024 || ++mirTick%2===0;     // on slow devices the mirrors refresh every other frame
  for(const m of MIRS){
    const r=m.el.getBoundingClientRect(), w=m.el.clientWidth, h=m.el.clientHeight;
    m.quad.visible=w>0 && h>0; if(!m.quad.visible) continue;
    m.quad.position.set(r.left-cr.left+m.el.clientLeft+w/2, -(r.top-cr.top+m.el.clientTop+h/2), 0); m.quad.scale.set(w,h,1);
    const tw=Math.round(w*pr*0.75), th=Math.round(h*pr*0.75);
    if(tw!==m.w || th!==m.h){ m.w=tw; m.h=th; m.rt.setSize(tw,th);
      m.cam.aspect=w/h; m.cam.fov=2*Math.atan(Math.tan(m.hfov*Math.PI/360)/m.cam.aspect)*180/Math.PI; m.cam.updateProjectionMatrix(); }
    if(fresh){ renderer.setRenderTarget(m.rt); renderer.render(scene,m.cam); }
  }
  renderer.setRenderTarget(null);
}
let lastPh=false;
function hud(){
  const S=st, ph=(S.T*2.6%1)<0.5, kmh=S.v*3.6; $('kmh').textContent=Math.round(kmh);
  $('needle').setAttribute('transform',`rotate(${(150+Math.min(kmh,80)*3).toFixed(1)} 50 50)`);
  $('mirL').classList.toggle('on',S.T-S.lastMir[-1]<0.8); $('mirR').classList.toggle('on',S.T-S.lastMir[1]<0.8);
  if(S.blink && S.mode==='run' && ph!==lastPh) sfx('tick'); lastPh=ph;
  if(ac && engGain){ const on=S.mode==='run' && $('sound').checked; eng.frequency.value=46+S.v*7+(keys.gas?9:0); engGain.gain.value=on?0.03+(keys.gas?0.02:0):0; }
  $('blL').className='key blink'+(S.blink===-1?' on'+(ph?'':' dim'):'');
  $('blR').className='key blink'+(S.blink===1?' on'+(ph?'':' dim'):'');
  $('indL').classList.toggle('on',S.blink===-1&&ph); $('indR').classList.toggle('on',S.blink===1&&ph);
  $('lookL').classList.toggle('on',S.look===-1); $('lookR').classList.toggle('on',S.look===1);
  $('gas').classList.toggle('on',keys.gas); $('brake').classList.toggle('on',keys.brake);
}

/* ---------- input ---------- */
const doBlink=side=>{ const S=st; if(S.mode!=='run') return;
  if(S.blink===side) S.blink=0; else { S.blink=side; S.blinkOn[side]=S.T; S.mirAtBlink[side]=S.lastMir[side]; } };
const doLook=side=>{ if(st.mode==='run'){ st.look=side; st.lookUntil=st.T+1.5; st.lastLook[side]=st.T; } };
const doMirror=side=>{ if(st.mode==='run') st.lastMir[side]=st.T; };
const camLabel=()=>{ $('camBtn').textContent=camMode==='chase'?T.camOut:T.camIn; };
function toggleCam(){ camMode=camMode==='chase'?'cockpit':'chase'; camLabel(); }
function hold(el,k){
  const dn=e=>{ e.preventDefault(); if(st.mode==='run') keys[k]=true; try{ el.setPointerCapture(e.pointerId); }catch(_){} }, up=()=>{ keys[k]=false; };
  el.addEventListener('pointerdown',dn); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
const tap=(el,fn)=>{ el.addEventListener('pointerdown',e=>{ e.preventDefault(); fn(); }); el.addEventListener('contextmenu',e=>e.preventDefault()); };
hold($('gas'),'gas'); hold($('brake'),'brake');
tap($('blL'),()=>doBlink(-1)); tap($('blR'),()=>doBlink(1)); tap($('lookL'),()=>doLook(-1)); tap($('lookR'),()=>doLook(1));
tap($('mirL'),()=>doMirror(-1)); tap($('mirR'),()=>doMirror(1));
$('camBtn').addEventListener('click',toggleCam);
{ const pad=$('steer'), knob=$('knob'); let id=null, x0=0;
  pad.addEventListener('pointerdown',e=>{ e.preventDefault(); if(st.mode!=='run') return; id=e.pointerId; x0=e.clientX; touchSteer=0; try{ pad.setPointerCapture(id); }catch(_){} });
  pad.addEventListener('pointermove',e=>{ if(e.pointerId!==id) return; const half=pad.clientWidth*0.34, v=clamp((e.clientX-x0)/half,-1,1); touchSteer=Math.sign(v)*Math.pow(Math.abs(v),1.4); knob.style.transform=`translateX(${v*half}px) rotate(${v*70}deg)`; pad.setAttribute('aria-valuenow',Math.round(v*100)); });
  const up=e=>{ if(e.pointerId!==id) return; id=null; touchSteer=null; knob.style.transform=''; pad.setAttribute('aria-valuenow','0'); };
  pad.addEventListener('pointerup',up); pad.addEventListener('pointercancel',up); pad.addEventListener('lostpointercapture',up); pad.addEventListener('contextmenu',e=>e.preventDefault()); }
const KEYMAP={ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake',Space:'brake',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',e=>{
  if(st.mode!=='run') return; const k=KEYMAP[e.code];
  if(k){ keys[k]=true; e.preventDefault(); return; }
  if(e.repeat) return;
  if(e.code==='KeyQ') doBlink(-1); else if(e.code==='KeyE') doBlink(1);
  else if(e.code==='Digit1'||e.code==='Numpad1') doLook(-1); else if(e.code==='Digit4'||e.code==='Numpad4') doLook(1);
  else if(e.code==='Digit2'||e.code==='Numpad2') doMirror(-1); else if(e.code==='Digit3'||e.code==='Numpad3') doMirror(1);
  else if(e.code==='KeyV') toggleCam();
});
window.addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=false; });
window.addEventListener('blur',()=>{ keys.gas=keys.brake=keys.left=keys.right=false; });

function start(){
  clearTimeout(resTimer); reset(); st.mode='run'; audioInit(); scoreHud();
  for(const id of ['intro','fail','result']) $(id).classList.remove('show');
  $('toast').classList.remove('show'); counts();
  say(0);
}
$('startBtn').addEventListener('click',start);
$('againBtn1').addEventListener('click',start);
$('againBtn2').addEventListener('click',start);
$('contBtn').addEventListener('click',()=>{ $('fail').classList.remove('show'); if(st.mode==='paused') st.mode='run'; });

/* ---------- loop ---------- */
function resize(){
  W=stage.clientWidth||360; H=stage.clientHeight||520;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(W,H,false);
  cam.aspect=W/H; cam.updateProjectionMatrix();
  hudCam.right=W; hudCam.bottom=-H; hudCam.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
let last=0;
function frame(t){
  const dt=Math.min(0.05,Math.max(0,(t-last)/1000)); last=t;
  if(st.mode==='run') update(dt);
  sync(); camera3(dt); mirrors(dt);
  renderer.render(scene,cam); renderer.autoClear=false; renderer.render(hudScene,hudCam); renderer.autoClear=true; hud();
  requestAnimationFrame(frame);
}
reset(); resize();
onLang=()=>{ camLabel(); scoreHud(); counts(); failSheet(); resultSheet(); }; onLang();
window.__game={get st(){return st;},update,start,keys,doBlink,doLook,doMirror,toggleCam,pathAt,ROUTE,setSteer:v=>{touchSteer=v;},
  R:{nA,nB,nC,nD,nE,LINE_C,LINE_D,ZEBRA,END0,END1,SC_A,SC_C,SC_CYC,SC_E}};
requestAnimationFrame(frame);
})();
</script>
</body>
